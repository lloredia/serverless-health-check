name: Deploy

# Plan and apply do not run on pull_request. This workflow has no
# pull_request trigger, and each job checks the event name again.
# Plan and apply also do not run unless AWS_ROLE_ARN, TF_STATE_BUCKET,
# and TF_LOCK_TABLE are set (repository or environment secrets).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: "1.16.5"
  TF_IN_AUTOMATION: "true"

jobs:
  guard:
    name: AWS configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Require repository secrets
        id: check
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          if [ -n "$AWS_ROLE_ARN" ] && [ -n "$TF_STATE_BUCKET" ] && [ -n "$TF_LOCK_TABLE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Set repository secrets AWS_ROLE_ARN, TF_STATE_BUCKET, and TF_LOCK_TABLE. Plan/apply will not run."
          fi

  terraform-staging:
    name: Staging
    needs: guard
    if: |
      github.event_name != 'pull_request' &&
      needs.guard.outputs.configured == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require AWS configuration
        id: guard
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ] || [ -z "$TF_STATE_BUCKET" ] || [ -z "$TF_LOCK_TABLE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::AWS_ROLE_ARN, TF_STATE_BUCKET, and TF_LOCK_TABLE are not all set. Plan/apply will not run."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        if: steps.guard.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        if: steps.guard.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-staging-${{ github.run_id }}

      - name: Write backend config
        if: steps.guard.outputs.configured == 'true'
        working-directory: terraform
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          umask 077
          cat > backends/staging.hcl <<EOF
          bucket         = "${TF_STATE_BUCKET}"
          key            = "serverless-health-check/staging/terraform.tfstate"
          region         = "${AWS_REGION}"
          dynamodb_table = "${TF_LOCK_TABLE}"
          encrypt        = true
          EOF

      - name: Terraform fmt
        if: steps.guard.outputs.configured == 'true'
        run: terraform fmt -check -recursive

      - name: Terraform init
        if: steps.guard.outputs.configured == 'true'
        working-directory: terraform
        run: terraform init -input=false -lock-timeout=120s -backend-config=backends/staging.hcl

      - name: Terraform validate
        if: steps.guard.outputs.configured == 'true'
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        if: steps.guard.outputs.configured == 'true'
        working-directory: terraform
        run: terraform plan -input=false -lock-timeout=120s -var-file=environments/staging.tfvars -out=staging.tfplan

      - name: Terraform apply
        if: steps.guard.outputs.configured == 'true'
        working-directory: terraform
        run: terraform apply -input=false -lock-timeout=120s -auto-approve staging.tfplan

      - name: Test GET /health
        if: steps.guard.outputs.configured == 'true'
        working-directory: terraform
        run: |
          endpoint="$(terraform output -raw api_endpoint)"
          echo "Testing ${endpoint}"
          for _ in 1 2 3 4 5 6; do
            if curl -fsS "$endpoint"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  terraform-prod:
    name: Production
    needs: [guard, terraform-staging]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.guard.outputs.configured == 'true' &&
      (
        needs.terraform-staging.result == 'success' ||
        needs.terraform-staging.result == 'skipped'
      ) &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require AWS configuration
        id: guard
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ] || [ -z "$TF_STATE_BUCKET" ] || [ -z "$TF_LOCK_TABLE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::AWS_ROLE_ARN, TF_STATE_BUCKET, and TF_LOCK_TABLE are not all set. Plan/apply will not run."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        if: steps.guard.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        if: steps.guard.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-prod-${{ github.run_id }}

      - name: Write backend config
        if: steps.guard.outputs.configured == 'true'
        working-directory: terraform
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          umask 077
          cat > backends/prod.hcl <<EOF
          bucket         = "${TF_STATE_BUCKET}"
          key            = "serverless-health-check/prod/terraform.tfstate"
          region         = "${AWS_REGION}"
          dynamodb_table = "${TF_LOCK_TABLE}"
          encrypt        = true
          EOF

      - name: Terraform fmt
        if: steps.guard.outputs.configured == 'true'
        run: terraform fmt -check -recursive

      - name: Terraform init
        if: steps.guard.outputs.configured == 'true'
        working-directory: terraform
        run: terraform init -input=false -lock-timeout=120s -backend-config=backends/prod.hcl

      - name: Terraform validate
        if: steps.guard.outputs.configured == 'true'
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        if: steps.guard.outputs.configured == 'true'
        working-directory: terraform
        run: terraform plan -input=false -lock-timeout=120s -var-file=environments/prod.tfvars -out=prod.tfplan

      - name: Terraform apply
        if: steps.guard.outputs.configured == 'true'
        working-directory: terraform
        run: terraform apply -input=false -lock-timeout=120s -auto-approve prod.tfplan

      - name: Test GET /health
        if: steps.guard.outputs.configured == 'true'
        working-directory: terraform
        run: |
          endpoint="$(terraform output -raw api_endpoint)"
          echo "Testing ${endpoint}"
          for _ in 1 2 3 4 5 6; do
            if curl -fsS "$endpoint"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
