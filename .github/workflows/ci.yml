name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.16.5"
  TFLINT_VERSION: v0.64.0
  PYTHON_VERSION: "3.11"

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Validate application
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate bootstrap
        working-directory: bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --chdir=terraform --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --chdir=bootstrap --config="$GITHUB_WORKSPACE/.tflint.hcl"

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run checkov
        run: |
          pip install "checkov==3.2.449"
          checkov -d terraform -d bootstrap --quiet --compact --framework terraform

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            lambda/requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check lambda tests

      - name: pytest
        run: pytest --cov=health_check --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90

      - name: Publish coverage report
        if: always()
        run: |
          {
            echo "## Coverage"
            echo
            echo '```'
            python -m coverage report --fail-under=0
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

      - name: pip-audit
        run: pip-audit -r lambda/requirements.txt -r requirements-dev.txt

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          version=v8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${version}/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks detect --source . --redact --no-banner
